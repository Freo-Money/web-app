<div class="search-dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{ 'labels.text.Search' | translate }}</h2>
    <button mat-icon-button type="button" mat-dialog-close class="close-button" aria-label="Close search dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    <div class="search-bar layout-row">
      <mat-form-field class="resource">
        <mat-label>{{ 'labels.inputs.Resource' | translate }}</mat-label>
        <mat-select [formControl]="resource">
          <mat-option *ngFor="let option of resourceOptions" [value]="option.value">
            {{ 'labels.text.' + option.name | translate }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="search">
        <mat-label>{{ 'labels.text.Search' | translate }}</mat-label>
        <input matInput type="text" [formControl]="query" (keydown.enter)="search()" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-raised-button color="primary" type="button" (click)="search()">
      {{ 'labels.text.Search' | translate }}
    </button>
  </mat-dialog-actions>
</div>
