<div class="container mat-elevation-z8">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form">
        <div class="layout-column">
          <mat-form-field (click)="picker.open()">
            <mat-label>Run as on date</mat-label>
            <input matInput [min]="minDate" [max]="maxDate" [matDatepicker]="picker" formControlName="runAsOnDate" />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="form.controls.runAsOnDate.hasError('required')">
              Run as on date is <strong>required</strong>
            </mat-error>
          </mat-form-field>
        </div>
      </form>

      <mat-card-actions class="layout-row align-center gap-5px responsive-column">
        <button type="button" mat-raised-button (click)="cancel()">
          {{ 'labels.buttons.Cancel' | translate }}
        </button>
        <button mat-raised-button color="primary" type="button" (click)="submit()">
          {{ 'labels.buttons.Submit' | translate }}
        </button>
      </mat-card-actions>
    </mat-card-content>
  </mat-card>
</div>
